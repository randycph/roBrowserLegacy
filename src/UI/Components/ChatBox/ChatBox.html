<div id="chatbox">
	<table class="header" cellpadding="0" cellspacing="0" border="0" width="100%">
		<tbody>
			<tr>
				<td class="opttab"><div class="options"></div></td>
			</tr>
		</tbody>
	</table>
	<div class="chat-function">
		<button type="button" class="cfunc chatmode" title="Send message or toggle chat mode" aria-label="Send message or toggle chat mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-4 3v-3H4z"/><path d="M8 10h8"/></svg></button>
		<button type="button" class="cfunc battleopt" title="Chat tab settings" aria-label="Chat tab settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg></button>
		<button type="button" class="cfunc stickfucn" title="Pin chat window (unavailable)" aria-label="Pin chat window (unavailable)" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 6 1 1 5 3 3-5 1-4 6-1-1 4-6-2-4-3-2z"/></svg></button>
		<button type="button" class="cfunc battleopt2" title="Add chat tab" aria-label="Add chat tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
		<button type="button" class="cfunc wndminib" title="Remove current chat tab" aria-label="Remove current chat tab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
		<button type="button" class="cfunc lockdragwnd" title="Lock chat position (unavailable)" aria-label="Lock chat position (unavailable)" aria-disabled="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="10" width="12" height="10" rx="2"/><path d="M9 10V7a3 3 0 0 1 6 0v3m-3 4v2"/></svg></button>
	</div>
	<div class="body">
		<div class="event_add_cursor draggable"></div>
		<div class="contentwrapper"></div>
	</div>

	<div class="battlemode"><button class="bmtoggle">...</button></div>
	<div class="input" data-background="basic_interface/dialog_bg.bmp">
		<input type="text" class="username" />
		<ui-button
			class="list"
			bg="basic_interface/dialog_btn0.bmp"
			hover="basic_interface/dialog_btn1.bmp"
			down="basic_interface/dialog_btn2.bmp"
		></ui-button>
		<div class="wrapper"><div contenteditable="true" class="message input-chatbox"></div></div>
		<button
			class="filter"
			data-background="basic_interface/sys_base_off.bmp"
			data-down="basic_interface/sys_base_off.bmp"
		></button>
		<button
			class="size"
			data-background="basic_interface/sys_base_off.bmp"
			data-down="basic_interface/sys_base_off.bmp"
		></button>
	</div>
</div>
