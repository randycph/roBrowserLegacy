<div id="ReadRodex" role="dialog" aria-label="Mail message">
	<header class="titlebar popup-heading">
		<img class="header-icon" src="/src/UI/Components/popup-icons/mail.png" alt="" />
		<h2 class="popup-title">Mail message</h2>
		<div class="popup-heading-actions">
			<button type="button" class="delete">Delete</button>
			<button type="button" class="close" aria-label="Close message">×</button>
		</div>
	</header>
	<div class="message-scroll" tabindex="0" aria-label="Message content">
		<h2 class="title-text"></h2>
		<p class="name"></p>
		<p class="sent-date"></p>
		<p class="content-text"></p>
		<div class="attachment-row">
			<div class="item-list" aria-label="Attached items"></div>
			<button type="button" class="get-content claim">Claim items</button>
		</div>
		<div class="attachment-row">
			<span class="value"></span>
			<button type="button" class="get-zeny claim">Claim zeny</button>
		</div>
	</div>
</div>
