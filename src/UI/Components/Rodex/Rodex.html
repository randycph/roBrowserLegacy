<div class="mail-backdrop" aria-hidden="true"></div>
<div id="Rodex" role="dialog" aria-label="Mail">
	<header class="popup-heading">
		<img class="header-icon" src="/src/UI/Components/popup-icons/mail.png" alt="" />
		<h1 class="popup-title">Mail</h1>
		<button type="button" class="close" aria-label="Close mail">×</button>
	</header>
	<div class="rodex-list" tabindex="0" aria-label="Messages">
		<ul class="mail-list"></ul>
		<p class="mail-empty" role="status" hidden>No messages.</p>
	</div>
	<template class="mail-row-template">
		<li class="mail-item">
			<span class="mail-image" aria-hidden="true"></span>
			<div class="mail-text">
				<button type="button" class="mail-subject"></button>
				<span class="mail-sender"></span>
			</div>
			<div class="mail-action">
				<span class="mail-date"></span>
				<button type="button" class="claim mail-claim" hidden>Collect</button>
			</div>
		</li>
	</template>
</div>
