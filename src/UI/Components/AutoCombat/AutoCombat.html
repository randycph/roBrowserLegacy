<div id="AutoCombat">
 <div class="titlebar" data-background="basic_interface/titlebar_mid.bmp"><span>Auto Combat</span><button class="close" type="button" aria-label="Close" data-background="basic_interface/sys_close_off.bmp" data-hover="basic_interface/sys_close_on.bmp"></button></div>
 <div class="content">
  <p class="status" role="status">Stopped</p>
  <label><input type="checkbox" class="auto-loot"> Auto Loot</label>
  <label>Roam radius <input class="radius" type="number" min="1" max="30" value="10"> cells</label>
  <small>Roams around the position where you press Start.</small>
  <label>Monsters <select class="monster-mode"><option value="all">All monsters</option><option value="selected">Selected monsters</option></select></label>
  <div class="monster-options options" hidden><label>Search <input class="monster-search" type="search" placeholder="Monster name"></label><select class="monster-list" multiple size="5" aria-label="Select monsters"></select><small class="monster-availability"></small><small class="monster-count">0 selected</small><small>Use Ctrl or Command to select more than one.</small></div>
  <label><input type="checkbox" class="auto-skill"> Auto-cast skill</label>
  <div class="skill-options options"><label>Skills <select class="skill" multiple size="4"></select></label><label>Level <input class="level" type="number" min="1" max="10" value="1"></label><label>Delay between skills (seconds) <input class="interval" type="number" min="2" max="60" value="3"></label></div>
  <label><input type="checkbox" class="auto-buff"> Auto-cast self buffs</label>
  <div class="buff-options options" hidden><label>Buffs <select class="buffs" multiple size="4" aria-label="Select self buffs"></select></label><label>Level <input class="buff-level" type="number" min="1" max="10" value="1"></label><small>Supported learned buffs only. Hold Ctrl or Command to select several.</small></div>
  <label><input type="checkbox" class="auto-recovery"> Auto recovery</label>
  <div class="recovery-options options"><label>Use <select class="potion"></select></label><label>When <select class="resource"><option value="hp">HP</option><option value="sp">SP</option></select> is below <input class="threshold" type="number" min="1" max="99" value="50">%</label></div>
  <label><input type="checkbox" class="auto-fly"> Use Fly Wing for safety</label>
  <div class="fly-options options"><label>When HP is below <input class="fly-threshold" type="number" min="1" max="99" value="20">%</label><small>Resumes combat after teleporting, with a 15-second Fly Wing cooldown.</small></div>
 </div>
 <div class="footer"><button class="start" type="button">Start</button><button class="stop" type="button">Stop</button></div>
</div>
