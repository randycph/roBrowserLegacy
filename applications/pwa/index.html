<!doctype html>
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta charset="UTF-8" />
		<title>Ragnarok Forever</title>
		<base href="/applications/pwa/" />
		<link rel="icon" type="image/png" href="./icon.png" />

		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<meta name="HandheldFriendly" content="true" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="roBrowser" />
		<meta name="mobile-web-app-capable" content="yes" />

		<meta name="description" content="roBrowser" />
		<meta name="keywords" content="roBrowser" />
		<meta name="author" content="roBrowser" />
		<meta name="robots" content="index" />

		<meta name="theme-color" content="#ff8cb5" />

		<meta property="og:title" content="roBrowser" />
		<meta property="og:description" content="roBrowser" />
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:image" content="./screenshotwide.png" />
		<meta property="og:image:width" content="1920" />
		<meta property="og:image:height" content="1080" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:alt" content="roBrowser Progressive Web App" />

		<link rel="apple-touch-icon" href="./icon.png" />
		<link rel="manifest" href="./manifest.webmanifest" />

		<style type="text/css">
			html,
			body {
				margin: 0;
				padding: 0;
				border: 0;
				height: 100%;
				width: 100%;
				overflow: hidden;
			}
			#robrowser {
				height: 100%;
				width: 100%;
			}
			/* Pre-loader — appears instantly, before any JS */
			#ro-preloader {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 99999;
				background: rgba(6, 8, 16, 0.97);
				display: flex;
				align-items: center;
				justify-content: center;
				flex-direction: column;
			}
			#ro-preloader .pre-scene {
				position: relative;
				width: 130px;
				height: 130px;
				overflow: hidden;
			}
			#ro-preloader .pre-poring {
				position: absolute;
				left: 50%;
				top: 50%;
				width: 96px;
				object-fit: contain;
				image-rendering: pixelated;
				animation: ro-pre-bounce 1.15s ease-in-out infinite;
			}
			@keyframes ro-pre-bounce {
				0%, 100% { transform: translate(-50%, -40%) scale(1.08, 0.92); }
				50% { transform: translate(-50%, -75%) scale(0.94, 1.06); }
			}
			#ro-preloader.fade-out {
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			@media (prefers-reduced-motion: reduce) {
				#ro-preloader .pre-poring { animation: none; transform: translate(-50%, -50%); }
			}
		</style>

		<script type="text/javascript" src="../api/api.js?v=2"></script>
		<script type="text/javascript" src="Config.js"></script>
		<script type="text/javascript" src="Config.local.js"></script>
		<script type="text/javascript">
			function deepMerge(target, source) {
				for (var key in source) {
					if (source.hasOwnProperty(key)) {
						if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
							target[key] = deepMerge(target[key] || {}, source[key]);
						} else {
							target[key] = source[key];
						}
					}
				}
				return target;
			}

			function initialize(gitHash) {
				// Merge Config.js defaults with Config.local.js overrides
				var baseConfig = deepMerge({}, window.ROConfigBase || {});
				if (window.ROConfigLocal) {
					baseConfig = deepMerge(baseConfig, window.ROConfigLocal);
				}

				// Build ROConfig with dynamic values
				var ROConfig = Object.assign({}, baseConfig, {
					target: document.getElementById('robrowser'),
					type: ROBrowser.TYPE[baseConfig.type || 'FRAME'],
					application: ROBrowser.APP[baseConfig.application || 'ONLINE'],
					version: gitHash
				});
				var RO = new ROBrowser(ROConfig);
				RO.start();
			}

			window.addEventListener('load', function () {
				initialize('ragnarok-forever');
			}, false);

		</script>
	</head>

	<body>
		<!-- Pre-loader: aparece ANTES de qualquer JS carregar -->
		<div id="ro-preloader">
			<div class="pre-scene" aria-hidden="true">
				<img class="pre-poring" src="./assets/poring-chasing.webp" alt="" />
			</div>
		</div>

		<div id="robrowser">Initializing roBrowser...</div>
	</body>
</html>
