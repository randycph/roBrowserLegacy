<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>roBrowserLegacy</title>
		<link rel="icon" type="./icon.png" />

		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<meta name="HandheldFriendly" content="true" />

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="roBrowser" />
		<meta name="mobile-web-app-capable" content="yes" />

		<meta name="description" content="roBrowser" />
		<meta name="keywords" content="roBrowser" />
		<meta name="author" content="roBrowser" />
		<meta name="robots" content="index" />

		<meta name="theme-color" content="#ff8cb5" />

		<meta property="og:title" content="roBrowser" />
		<meta property="og:description" content="roBrowser" />
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="en_US" />

		<link rel="apple-touch-icon" href="./icon.png" />

		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				border: 0;
				height: 100%;
				width: 100%;
				overflow: hidden;
			}
			#ro-preloader {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 99999;
				background: rgba(6, 8, 16, 0.97);
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
			}
			#ro-preloader.fade-out {
				opacity: 0;
				transition: opacity 0.3s ease;
			}
			.pre-scene {
				position: relative;
				width: 130px;
				height: 130px;
				overflow: hidden;
			}
			.pre-poring {
				position: absolute;
				left: 50%;
				top: 50%;
				width: 96px;
				object-fit: contain;
				image-rendering: pixelated;
				animation: ro-pre-bounce 1.15s ease-in-out infinite;
			}
			@keyframes ro-pre-bounce {
				0%, 100% { transform: translate(-50%, -40%) scale(1.08, 0.92); }
				50% { transform: translate(-50%, -75%) scale(0.94, 1.06); }
			}
			@media (prefers-reduced-motion: reduce) {
				.pre-poring { animation: none; transform: translate(-50%, -50%); }
			}
		</style>

		<script src="../shared/importmap.js?v=npcshop2"></script>

		<script type="module">
			// Apply the window title even when a browser has an older dialog module cached.
			function updateLoginTitle() {
				const host = document.querySelector('#WinLoginV2, #WinLoginV3, #WinLogin');
				const panel = host?.shadowRoot?.querySelector('#WinLogin');
				if (!panel || panel.querySelector('.window-title')) return;

				const title = document.createElement('span');
				title.className = 'window-title';
				title.textContent = 'Login';
				Object.assign(title.style, {
					position: 'absolute', left: '15px', top: '1px',
					width: '47px', height: '14px',
					background: 'linear-gradient(to bottom, #b3c1dd, #cad4e9 22%, #99aed9 42%, #cadffb 78%, #c5def3)',
					color: '#111', font: '12px/14px Arial, sans-serif',
					textShadow: '1px 1px #fff', pointerEvents: 'none'
				});
				panel.appendChild(title);
			}
			function updateLoginBrand() {
				const background = [...document.body?.children || []].find(el =>
					el.style?.backgroundImage?.includes('login-snowball.jpg')
				);
				if (!background || background.querySelector('[data-ragnarok-brand="sky-title"]')) return;
				const brandFrame = document.createElement('div');
				brandFrame.dataset.ragnarokBrand = 'sky-title';
				Object.assign(brandFrame.style, {
					position: 'absolute', top: '26%', left: '50%',
					transform: 'translateX(-50%)', width: 'min(520px, 78vw)',
					padding: '0 12px', boxSizing: 'border-box',
					background: 'radial-gradient(ellipse, rgba(240,248,255,.48), rgba(240,248,255,0) 72%)',
					pointerEvents: 'none'
				});
				const brand = document.createElement('img');
				brand.src = '/applications/pwa/assets/ragnarok-forever-logo.png?v=3';
				brand.alt = 'Ragnarok Forever';
				Object.assign(brand.style, { display: 'block', width: '100%', height: 'auto', filter: 'drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 6px 4px rgba(29,58,105,.48))' });
				brandFrame.appendChild(brand);
				background.appendChild(brandFrame);
			}
			new MutationObserver(() => {
				updateLoginTitle();
				updateLoginBrand();
			}).observe(document, { childList: true, subtree: true });

			addEventListener(
				'message',
				function OnMessage(event) {
					// Only accept messages from the parent window or opener (the page that loaded us)
					if (event.source !== window.parent && event.source !== window.opener) {
						return;
					}

					removeEventListener('message', OnMessage, false);

					window.ROConfig = { ...event.data, enableRoulette: false, enableCheckAttendance: true };

					// Load the engine entry point as an ES6 module
					import('../../src/main.js')
						.then(() => {
							event.source.postMessage('ready', '*');
						})
						.catch(err => {
							console.error('Failed to load roBrowser engine:', err);
						});
				},
				false
			);
		</script>
	</head>
	<body>
		<div id="ro-preloader">
			<div class="pre-scene" aria-hidden="true">
				<img class="pre-poring" src="../pwa/assets/poring-chasing.webp" alt="" />
			</div>
		</div>
	</body>
</html>
